[package]
name = "opencrm"
version = "0.1.0"
description = "OpenCRM - Open Source CRM Alternative"
authors = ["OpenCRM Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "opencrm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri        = { version = "2", features = [] }
tauri-plugin-fs     = "2"
tauri-plugin-dialog = "2"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
log = "0.4"

[profile.release]
lto            = true
codegen-units  = 1
opt-level      = "z"
strip          = true
